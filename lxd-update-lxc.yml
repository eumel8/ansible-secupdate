- hosts: containers
  gather_facts: false
  become: false
  vars:
    snapshot_name: secupdate

  tasks:
    - name: Snapshot erstellen
      command: >
        lxc snapshot {{ inventory_hostname }} {{ snapshot_name }}
      delegate_to: localhost

    - name: Paketquellen aktualisieren
      command: >
        lxc exec {{ inventory_hostname }} -- apt-get update
      delegate_to: localhost

    - name: Pakete upgraden
      command: >
        lxc exec {{ inventory_hostname }} --
        env DEBIAN_FRONTEND=noninteractive
        apt-get -y -o Dpkg::Options::="--force-confdef"
        -o Dpkg::Options::="--force-confold" upgrade
      delegate_to: localhost

    - name: Snapshot löschen
      command: >
        lxc delete {{ inventory_hostname }}/{{ snapshot_name }}
      delegate_to: localhost
